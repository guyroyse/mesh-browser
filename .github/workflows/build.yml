name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# electron-builder needs write access to create and update the draft release
permissions:
  contents: write

jobs:
  build:
    strategy:
      # Each job publishes into the same draft release, so they are serialised:
      # running in parallel races to create it and can leave duplicate drafts.
      # Safe to drop to speed builds up if you would rather tidy those by hand.
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple certificate: skip signing rather than failing the build
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish always
